<!doctype html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body style="margin:0"><div id="root" class="fa"></div>
<script type="module">
import React from 'react';
import {createRoot} from 'react-dom/client';
import {Pager} from '../src/feed/Pager';
import {PostList} from '../src/feed/store';
import '../src/feed/feed.css';
const list = new PostList({type:'latest'});
const post = (i) => ({key:`fixture-${i}`, kind:'images', published_ts:1700000000+i,
  caption:`Scroll fixture ${i}`, tags:[], duration:null, width:390, height:844,
  stats:null, music:null, work_id:String(i), share_url:'', media:[{kind:'image',path:'fixture.svg'}], cover:'fixture.svg',
  liked:false, saved:false, pinned:false, meta_pending:false,
  author:{key:'fixture',platform:'douyin',url:'',name:'Test account',avatar:null,followed:false}});
list.items = Array.from({length:40}, (_,i)=>post(i));
list.hasMore = false;
const handleRef = {current:null};
const noop = ()=>{};
window.pagerFixture = {list, handleRef, append() {
  list.items = [...list.items, ...Array.from({length:20},(_,i)=>post(list.items.length+i))];
  list.emit();
}};
createRoot(document.getElementById('root')).render(React.createElement(Pager, {
  list, current:true, handleRef, ariaLabel:'Scroll fixture',
  actions:{openProfile:noop,openPanel:noop,openShare:noop,openTag:noop,openMusic:noop},
  onActivePost:post=>{window.activePost=post.key;},
}));
</script></body></html>
