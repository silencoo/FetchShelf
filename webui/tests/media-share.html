<!doctype html>
<html><head><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body style="margin:0;background:#000"><div id="root" class="fa"></div>
<script type="module">
import React from 'react';
import {createRoot} from 'react-dom/client';
import {ShareSheet} from '../src/feed/Sheets';
import {carouselPositions} from '../src/feed/Pager';
import {state} from '../src/legacy/state';
import '../src/feed/feed.css';
state.token = 'share-test-token';
const root = createRoot(document.getElementById('root'));
let sequence = 0;
function AnchoredShare({post, detachOnOpen}) {
  const [anchor, setAnchor] = React.useState(null);
  return React.createElement(React.Fragment, null,
    (!anchor || !detachOnOpen) ? React.createElement('button', {id:'share-trigger',
      'data-detach-on-open':String(detachOnOpen),
      style:{position:'absolute',right:24,bottom:160,width:48,height:48,color:'white'},
      onClick:({currentTarget:element})=>setAnchor({element,rect:element.getBoundingClientRect()})}, '分享') : null,
    anchor ? React.createElement(ShareSheet, {post,anchor,
      onClose:()=>setAnchor(null),onHideAuthor:()=>{}}) : null);
}
window.showShareFixture = (kind = 'images', anchored = false, detachOnOpen = false) => {
  const post = {key:'share-test',kind,caption:'分享测试',share_url:'https://example.test/post',
    author:{name:'Test account',platform:'douyin',url:'https://example.test/author'},
    cover:'first.jpeg',media:kind==='video' ? [{kind:'video',path:'movie.mp4'}]
      : [{kind:'image',path:'first.jpeg'},{kind:'image',path:'selected_2.jpeg'}]};
  carouselPositions.set(post.key, kind==='video' ? 0 : 1);
  if (anchored) {
    root.render(React.createElement(AnchoredShare, {key:++sequence,post,detachOnOpen}));
    return;
  }
  root.render(React.createElement(ShareSheet, {key:++sequence,post,
    onClose:()=>root.render(React.createElement('p',null,'Closed')),onHideAuthor:()=>{}}));
};
window.showShareFixture();
</script></body></html>
